const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const authors = [...new Set(DATA.days.flatMap(d => d.commits.map(c => c.author)))].sort();
const areas = [...new Set(DATA.days.flatMap(d => d.commits.flatMap(c => c.areas)))].sort();
authors.forEach(a => $('#author').insertAdjacentHTML('beforeend', `<option>${esc(a)}</option>`));
areas.forEach(a => $('#area').insertAdjacentHTML('beforeend', `<option>${esc(a)}</option>`));
$('#meta').textContent = `Generated ${DATA.generated} · from ${DATA.since} · times in Madrid time`;
function render(){
  const a = $('#author').value, ar = $('#area').value, q = $('#q').value.toLowerCase();
  const days = DATA.days.map(d => {
    const commits = d.commits.filter(c => (!a || c.author === a) && (!ar || c.areas.includes(ar)) &&
      (!q || c.subject.toLowerCase().includes(q) || c.sha.startsWith(q)));
    return {...d, commits};
  }).filter(d => d.commits.length || (d.doc_changes||[]).length);
  const all = days.flatMap(d => d.commits);
  const files = all.reduce((n,c)=>n+c.files_changed,0);
  $('#stats').innerHTML = [
    ['Days with activity', days.length],['Commits', all.length],
    ['Files changed', files],['Lines added', all.reduce((n,c)=>n+c.added,0)],
    ['Doc changes', days.reduce((n,d)=>n+(d.doc_changes||[]).length,0)]
  ].map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  $('#days').innerHTML = days.length ? days.map(d => {
    const by = [...new Set(d.commits.map(c => c.author))].join(', ') || '—';
    const rows = d.commits.map(c => `<div class="commit"><div class="t">${esc(c.time)}</div><div>
      <div class="s">${esc(c.subject)}</div>
      <div class="author">${esc(c.author)} · <code>${esc(c.sha)}</code> · ${c.files_changed} files, +${c.added} −${c.deleted}</div>
      <div class="tags">${c.areas.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div>`).join('');
    const docs = (d.doc_changes||[]).map(x => `<div class="docs">Doc: ${esc(x.by||'')} ${esc(x.summary||'')} <small>(${esc(x.path||'')})</small></div>`).join('');
    return `<div class="day"><div class="dayhead"><span>${d.date}</span><small>${d.commits.length} commits · ${esc(by)}</small></div>${rows}${docs}</div>`;
  }).join('') : '<div class="empty">No activity matches these filters.</div>';
}
['#author','#area','#q'].forEach(s => $(s).addEventListener('input', render));
render();
