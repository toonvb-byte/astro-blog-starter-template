<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 362" width="520" height="362" role="img" aria-labelledby="t d" lang="es">
<title id="t">Cuánto se acorta un resfriado</title>
<desc id="d">Revisiones Cochrane. Vitamina C: resfriado de 7 días en adultos.. Vitamina C a diario, todo el año: ~13 horas; Vitamina C al ponerse malo: Sin efecto constante; Zinc desde los primeros síntomas: ~2 días, certeza baja</desc>
<rect width="520" height="362" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
