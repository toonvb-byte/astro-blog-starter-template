<text x="24" y="62" font-size="15" fill="#5A6863">Revisiones Cochrane. Vitamina C: resfriado de 7 días en</text>
<text x="24" y="82" font-size="15" fill="#5A6863">adultos.</text>
<line x1="24" y1="122" x2="24" y2="296" stroke="#DCE1DD"/>
<text x="32" y="144" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Vitamina C a diario, todo el año</text>
<path d="M24.0,152.0 H87.5 Q91.5,152.0 91.5,156.0 V168.0 Q91.5,172.0 87.5,172.0 H24.0 Z" fill="#0B6B4F"/>
<text x="99.5" y="168.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">~13 horas</text>
<text x="32" y="202" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Vitamina C al ponerse malo</text>
<text x="32" y="226.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Sin efecto constante</text>
<text x="32" y="260" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Zinc desde los primeros síntomas</text>
<path d="M24.0,268.0 H269.1 Q273.1,268.0 273.1,272.0 V284.0 Q273.1,288.0 269.1,288.0 H24.0 Z" fill="#4A9C7B"/>
<text x="281.1" y="284.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">~2 días, certeza baja</text>
