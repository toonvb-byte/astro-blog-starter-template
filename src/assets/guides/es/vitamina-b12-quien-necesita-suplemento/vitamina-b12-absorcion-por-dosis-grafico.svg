<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 358" width="520" height="358" role="img" aria-labelledby="t d" lang="es">
<title id="t">Cuánta B12 absorbes de una dosis</title>
<desc id="d">µg absorbidos si la dosis se toma de una vez (NIH). Una dosis de 1 µg: ~0,5 µg (un 50 %); Un comprimido de 500 µg: ~10 µg (un 2 %); Un comprimido de 1.000 µg: ~13 µg (un 1,3 %)</desc>
<rect width="520" height="358" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">Cuánta B12 absorbes de una dosis</text>
<text x="24" y="62" font-size="15" fill="#5A6863">µg absorbidos si la dosis se toma de una vez (NIH)</text>
<g transform="translate(0,18)">
<line x1="72.6" y1="122" x2="72.6" y2="296" stroke="#9AA6A0" stroke-width="2"/>
<text x="68.6" y="112" font-size="13" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">VRN 2,5 µg</text>
<line x1="101.7" y1="122" x2="101.7" y2="296" stroke="#B4470E" stroke-width="2"/>
<text x="97.7" y="94" font-size="13" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">EFSA 4 µg</text>
<line x1="24" y1="122" x2="24" y2="296" stroke="#DCE1DD"/>
<text x="32" y="144" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Una dosis de 1 µg</text>
<path d="M24.0,152.0 H29.7 Q33.7,152.0 33.7,156.0 V168.0 Q33.7,172.0 29.7,172.0 H24.0 Z" fill="#0B6B4F"/>
<text x="41.7" y="168.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">~0,5 µg (un 50 %)</text>
<text x="32" y="202" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Un comprimido de 500 µg</text>
<path d="M24.0,210.0 H214.3 Q218.3,210.0 218.3,214.0 V226.0 Q218.3,230.0 214.3,230.0 H24.0 Z" fill="#0B6B4F"/>
<text x="226.3" y="226.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">~10 µg (un 2 %)</text>
<text x="32" y="260" font-size="16" fill="#10201A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Un comprimido de 1.000 µg</text>
<path d="M24.0,268.0 H272.6 Q276.6,268.0 276.6,272.0 V284.0 Q276.6,288.0 272.6,288.0 H24.0 Z" fill="#0B6B4F"/>
<text x="284.6" y="284.0" font-size="16" font-weight="600" fill="#3E4C46" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">~13 µg (un 1,3 %)</text>
</g>
<text x="496" y="340" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
