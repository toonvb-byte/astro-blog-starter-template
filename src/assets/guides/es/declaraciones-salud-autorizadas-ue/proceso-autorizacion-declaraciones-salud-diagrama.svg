<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 571" width="520" height="571" role="img" aria-labelledby="t d" lang="es">
<title id="t">Cómo llega una declaración a la etiqueta</title>
<desc id="d">Una empresa o un país de la UE presenta la declaración → La EFSA evalúa la evidencia científica → La Comisión y los países de la UE deciden → Autorizada: En el registro de la UE, con texto fijo. Vitaminas, minerales, creatina, melatonina / Rechazada: No se puede usar. Glucosamina, cepas probióticas. En espera desde 2010: Plantas y extractos: ashwagandha, cúrcuma, valeriana.</desc>
<rect width="520" height="571" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">Cómo llega una declaración a la etiqueta</text>
<text x="24" y="62" font-size="15" fill="#5A6863">Proceso de la UE según el Reglamento (CE) 1924/2006</text>
<rect x="24" y="88" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="107" font-size="16" fill="#10201A">Una empresa o un país de la</text>
<text x="38" y="129" font-size="16" fill="#10201A">UE presenta la declaración</text>
<line x1="164.0" y1="152" x2="164.0" y2="175" stroke="#5A6863" stroke-width="2"/>
<path d="M158.0,173 L164.0,182 L170.0,173 Z" fill="#5A6863"/>
<rect x="24" y="182" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="201" font-size="16" fill="#10201A">La EFSA evalúa la evidencia</text>
<text x="38" y="223" font-size="16" fill="#10201A">científica</text>
<line x1="304" y1="214.0" x2="319" y2="214.0" stroke="#5A6863" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M317,208.0 L326,214.0 L317,220.0 Z" fill="#5A6863"/>
<rect x="326" y="155" width="170" height="118" rx="10" fill="#EEF1EE"/>
<text x="338" y="179" font-size="14" font-weight="600" fill="#10201A">En espera desde 2010</text>
<text x="338" y="201" font-size="14" fill="#3E4C46">Plantas y</text>
<text x="338" y="220" font-size="14" fill="#3E4C46">extractos:</text>
<text x="338" y="239" font-size="14" fill="#3E4C46">ashwagandha,</text>
<text x="338" y="258" font-size="14" fill="#3E4C46">cúrcuma, valeriana</text>
<line x1="164.0" y1="246" x2="164.0" y2="296.0" stroke="#5A6863" stroke-width="2"/>
<path d="M158.0,294.0 L164.0,303.0 L170.0,294.0 Z" fill="#5A6863"/>
<rect x="24" y="303.0" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="322.0" font-size="16" fill="#10201A">La Comisión y los países de</text>
<text x="38" y="344.0" font-size="16" fill="#10201A">la UE deciden</text>
<path d="M164.0,367.0 V383.0 H138.0 V394.0" fill="none" stroke="#5A6863" stroke-width="2"/>
<path d="M132.0,392.0 L138.0,401.0 L144.0,392.0 Z" fill="#5A6863"/>
<rect x="24" y="401.0" width="228" height="124" rx="10" fill="#E3F1EA" stroke="#0B6B4F" stroke-width="1.5"/>
<text x="38" y="427.0" font-size="16" font-weight="600" fill="#10201A">Autorizada</text>
<text x="38" y="449.0" font-size="14" fill="#3E4C46">En el registro de la UE,</text>
<text x="38" y="468.0" font-size="14" fill="#3E4C46">con texto fijo.</text>
<text x="38" y="487.0" font-size="14" fill="#3E4C46">Vitaminas, minerales,</text>
<text x="38" y="506.0" font-size="14" fill="#3E4C46">creatina, melatonina</text>
<path d="M164.0,367.0 V383.0 H382.0 V394.0" fill="none" stroke="#5A6863" stroke-width="2"/>
<path d="M376.0,392.0 L382.0,401.0 L388.0,392.0 Z" fill="#5A6863"/>
<rect x="268" y="401.0" width="228" height="124" rx="10" fill="#FCEBDD" stroke="#B4470E" stroke-width="1.5"/>
<text x="282" y="427.0" font-size="16" font-weight="600" fill="#10201A">Rechazada</text>
<text x="282" y="449.0" font-size="14" fill="#3E4C46">No se puede usar.</text>
<text x="282" y="468.0" font-size="14" fill="#3E4C46">Glucosamina, cepas</text>
<text x="282" y="487.0" font-size="14" fill="#3E4C46">probióticas</text>
<text x="496" y="553" font-size="13" fill="#5A6863" text-anchor="end">nutrimetrics.eu</text>
</g></svg>
