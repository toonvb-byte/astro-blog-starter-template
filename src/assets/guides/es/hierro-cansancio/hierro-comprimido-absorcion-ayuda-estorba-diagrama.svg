<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 475" width="520" height="475" role="img" aria-labelledby="t d" lang="es">
<title id="t">Tomar hierro: qué ayuda y qué estorba</title>
<desc id="d">Tómalo con: Vitamina C, por ejemplo un vaso de zumo de naranja. Sepáralo un par de horas de: Calcio, Café, Té. En días alternos, si tu médico está de acuerdo: En mujeres con reservas bajas se absorbió alrededor de un tercio más que tomándolo a diario.</desc>
