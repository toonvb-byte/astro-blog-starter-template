<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 570" width="520" height="570" role="img" aria-labelledby="t d" lang="es">
<title id="t">Qué pueden declarar la vitamina D y la K</title>
<desc id="d">Declaraciones de salud autorizadas en la UE. No hay ninguna para la combinación. Función normal del sistema inmunitario: D; Huesos normales: D + K; Función muscular normal: D; Absorción del calcio: D; Coagulación sanguínea normal: K. No autorizado: Salud de las arterias, «Lleva el calcio a los huesos», Cualquier declaración para D + K2 juntas</desc>
