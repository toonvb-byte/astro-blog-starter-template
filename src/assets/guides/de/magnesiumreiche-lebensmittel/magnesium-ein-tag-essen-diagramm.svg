<title id="t">Ein Tag Essen mit 499 mg Magnesium</title>
<desc id="d">Drei Mahlzeiten aus diesem Ratgeber im Vergleich zur angemessenen Zufuhr der EFSA. Frühstück: Haferbrei mit Banane und Kürbiskernen (Rezept unten) 210 mg; Mittag- oder Abendessen: Weiße-Bohnen-Spinat-Eintopf mit Vollkornbrot (Rezept unten) 208 mg; Zwischendurch: Eine Handvoll Mandeln (30 g) 81 mg. Total 499 mg.</desc>
