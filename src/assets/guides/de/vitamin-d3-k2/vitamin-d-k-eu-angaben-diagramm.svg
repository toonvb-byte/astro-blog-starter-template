<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 570" width="520" height="570" role="img" aria-labelledby="t d" lang="de">
<title id="t">Was Vitamin D und K versprechen dürfen</title>
<desc id="d">Zugelassene EU-Gesundheitsangaben. Für die Kombination gibt es keine. Normale Funktion des Immunsystems: D; Normale Knochen: D + K; Normale Muskelfunktion: D; Kalziumaufnahme: D; Normale Blutgerinnung: K. Nicht zugelassen: Gefäßgesundheit, „Lenkt Kalzium in die Knochen“, Jede Angabe für D + K2 zusammen</desc>
