<text x="24" y="62" font-size="15" fill="#5A6863">Zugelassene EU-Gesundheitsangaben. Für die Kombination gibt</text>
<text x="24" y="82" font-size="15" fill="#5A6863">es keine.</text>
<text x="352" y="126" font-size="14" font-weight="600" text-anchor="middle" fill="#3E4C46">Vitamin D</text>
