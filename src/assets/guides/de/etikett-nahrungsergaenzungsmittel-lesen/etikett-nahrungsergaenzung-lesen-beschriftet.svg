<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" width="520" height="800" role="img" aria-labelledby="t d" lang="de">
<title id="t">So liest du ein Etikett</title>
<desc id="d">Beispiel-Etikett eines erfundenen Produkts, mit den fünf Punkten zum Prüfen. 1. Tagesdosis: hier 2 Kapseln, die Dose reicht also 30 Tage, nicht 60. 2. Menge pro Tagesdosis: das, was du zwischen Produkten vergleichst. 3. % NRV: die Menge im Vergleich zum EU-Bezugswert, kein Höchstwert. 4. Form: angegeben ist das Magnesium selbst, nicht das Gewicht des Citrats. 5. Pflichthinweise: Höchstmenge, abwechslungsreiche Ernährung, Kinder.</desc>
<rect width="520" height="800" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">So liest du ein Etikett</text>
<text x="24" y="62" font-size="15" fill="#5A6863">Beispiel-Etikett eines erfundenen Produkts, mit den fünf</text>
<text x="24" y="82" font-size="15" fill="#5A6863">Punkten zum Prüfen</text>
<rect x="38" y="120" width="444" height="382" rx="12" fill="#FBFCFA" stroke="#3E4C46" stroke-width="1.5"/>
<rect x="386" y="132" width="80" height="22" rx="11" fill="#FCEBDD"/>
<text x="426" y="147" font-size="11" font-weight="700" text-anchor="middle" fill="#B4470E">BEISPIEL</text>
<text x="54" y="150" font-size="12" font-weight="600" fill="#5A6863">NAHRUNGSERGÄNZUNGSMITTEL</text>
<text x="54" y="174" font-size="19" font-weight="700" fill="#10201A">Magnesium + Vitamin B6</text>
<text x="54" y="200" font-size="13" fill="#5A6863">60 Kapseln</text>
<rect x="54" y="220" width="412" height="34" fill="#10201A"/>
<text x="64" y="242" font-size="13" font-weight="600" fill="#FFFFFF">Pro Tagesdosis (2 Kapseln)</text>
<text x="456" y="242" font-size="13" font-weight="600" text-anchor="end" fill="#FFFFFF">% NRV*</text>
<rect x="54" y="254" width="412" height="46" fill="#F4F6F4" stroke="#DCE1DD"/>
<text x="64" y="274" font-size="14" font-weight="600" fill="#10201A">Magnesium</text>
<text x="64" y="291" font-size="12" fill="#3E4C46">(aus Magnesiumcitrat)</text>
<text x="372" y="281" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">150 mg</text>
<text x="456" y="281" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">40 %</text>
<rect x="54" y="300" width="412" height="46" fill="#FFFFFF" stroke="#DCE1DD"/>
<text x="64" y="320" font-size="14" font-weight="600" fill="#10201A">Vitamin B6</text>
<text x="372" y="327" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">1,4 mg</text>
<text x="456" y="327" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">100 %</text>
<text x="54" y="364" font-size="11" fill="#5A6863">*NRV = Nährstoffbezugswert</text>
<text x="54" y="386" font-size="12" fill="#10201A">Verzehrempfehlung: 2 Kapseln täglich. Die angegebene</text>
<text x="54" y="402" font-size="12" fill="#10201A">empfohlene tägliche Verzehrsmenge darf nicht überschritten</text>
<text x="54" y="418" font-size="12" fill="#10201A">werden.</text>
<text x="54" y="440" font-size="12" fill="#3E4C46">Nahrungsergänzungsmittel sind kein Ersatz für eine</text>
<text x="54" y="456" font-size="12" fill="#3E4C46">ausgewogene und abwechslungsreiche Ernährung. Außerhalb der</text>
<text x="54" y="472" font-size="12" fill="#3E4C46">Reichweite von kleinen Kindern lagern.</text>
<circle cx="257" cy="237" r="11" fill="#B4470E"/>
<text x="257.3" y="242" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="307" cy="277" r="11" fill="#B4470E"/>
<text x="307.0" y="282" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="402" cy="218" r="11" fill="#B4470E"/>
<text x="402" y="223" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="211" cy="287" r="11" fill="#B4470E"/>
<text x="211.0" y="292" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<circle cx="468" cy="436" r="11" fill="#B4470E"/>
<text x="468" y="441" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<circle cx="35" cy="525" r="11" fill="#B4470E"/>
<text x="35" y="530" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="56" y="530" font-size="14" fill="#3E4C46">Tagesdosis: hier 2 Kapseln, die Dose reicht also 30 Tage,</text>
<text x="56" y="549" font-size="14" fill="#3E4C46">nicht 60</text>
<circle cx="35" cy="573" r="11" fill="#B4470E"/>
<text x="35" y="578" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="56" y="578" font-size="14" fill="#3E4C46">Menge pro Tagesdosis: das, was du zwischen Produkten</text>
<text x="56" y="597" font-size="14" fill="#3E4C46">vergleichst</text>
<circle cx="35" cy="621" r="11" fill="#B4470E"/>
<text x="35" y="626" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="56" y="626" font-size="14" fill="#3E4C46">% NRV: die Menge im Vergleich zum EU-Bezugswert, kein</text>
<text x="56" y="645" font-size="14" fill="#3E4C46">Höchstwert</text>
<circle cx="35" cy="669" r="11" fill="#B4470E"/>
<text x="35" y="674" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="56" y="674" font-size="14" fill="#3E4C46">Form: angegeben ist das Magnesium selbst, nicht das Gewicht</text>
<text x="56" y="693" font-size="14" fill="#3E4C46">des Citrats</text>
<circle cx="35" cy="717" r="11" fill="#B4470E"/>
<text x="35" y="722" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="56" y="722" font-size="14" fill="#3E4C46">Pflichthinweise: Höchstmenge, abwechslungsreiche Ernährung,</text>
<text x="56" y="741" font-size="14" fill="#3E4C46">Kinder</text>
<text x="496" y="782" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
</g></svg>
