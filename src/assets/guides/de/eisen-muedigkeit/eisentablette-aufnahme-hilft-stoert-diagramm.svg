<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 475" width="520" height="475" role="img" aria-labelledby="t d" lang="de">
<title id="t">Eisen einnehmen: was hilft, was stört</title>
<desc id="d">Zusammen mit: Vitamin C, zum Beispiel einem Glas Orangensaft. Ein paar Stunden Abstand zu: Kalzium, Kaffee, Tee. Jeden zweiten Tag, nach ärztlicher Rücksprache: Bei Frauen mit niedrigen Speichern wurde etwa ein Drittel mehr aufgenommen als bei täglicher Einnahme.</desc>
