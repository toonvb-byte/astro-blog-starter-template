<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 571" width="520" height="571" role="img" aria-labelledby="t d" lang="de">
<title id="t">Wie ein Health Claim aufs Etikett kommt</title>
<desc id="d">Ein Unternehmen oder EU-Land reicht die Angabe ein → Die EFSA prüft die wissenschaftlichen Belege → Kommission und EU-Länder entscheiden → Zugelassen: Im EU-Register, mit festem Wortlaut. Vitamine, Mineralstoffe, Kreatin, Melatonin / Abgelehnt: Darf nicht verwendet werden. Glucosamin, Probiotika-Stämme. Seit 2010 „on hold“: Pflanzen und Extrakte: Ashwagandha, Kurkuma, Baldrian.</desc>
<rect width="520" height="571" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">Wie ein Health Claim aufs Etikett kommt</text>
<text x="24" y="62" font-size="15" fill="#5A6863">EU-Verfahren nach Verordnung (EG) Nr. 1924/2006</text>
<rect x="24" y="88" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="107" font-size="16" fill="#10201A">Ein Unternehmen oder EU-Land</text>
<text x="38" y="129" font-size="16" fill="#10201A">reicht die Angabe ein</text>
<line x1="164.0" y1="152" x2="164.0" y2="175" stroke="#5A6863" stroke-width="2"/>
<path d="M158.0,173 L164.0,182 L170.0,173 Z" fill="#5A6863"/>
<rect x="24" y="182" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="201" font-size="16" fill="#10201A">Die EFSA prüft die</text>
<text x="38" y="223" font-size="16" fill="#10201A">wissenschaftlichen Belege</text>
<line x1="304" y1="214.0" x2="319" y2="214.0" stroke="#5A6863" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M317,208.0 L326,214.0 L317,220.0 Z" fill="#5A6863"/>
<rect x="326" y="155" width="170" height="118" rx="10" fill="#EEF1EE"/>
<text x="338" y="179" font-size="14" font-weight="600" fill="#10201A">Seit 2010 „on hold“</text>
<text x="338" y="201" font-size="14" fill="#3E4C46">Pflanzen und</text>
<text x="338" y="220" font-size="14" fill="#3E4C46">Extrakte:</text>
<text x="338" y="239" font-size="14" fill="#3E4C46">Ashwagandha,</text>
<text x="338" y="258" font-size="14" fill="#3E4C46">Kurkuma, Baldrian</text>
<line x1="164.0" y1="246" x2="164.0" y2="296.0" stroke="#5A6863" stroke-width="2"/>
<path d="M158.0,294.0 L164.0,303.0 L170.0,294.0 Z" fill="#5A6863"/>
<rect x="24" y="303.0" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="322.0" font-size="16" fill="#10201A">Kommission und EU-Länder</text>
<text x="38" y="344.0" font-size="16" fill="#10201A">entscheiden</text>
<path d="M164.0,367.0 V383.0 H138.0 V394.0" fill="none" stroke="#5A6863" stroke-width="2"/>
<path d="M132.0,392.0 L138.0,401.0 L144.0,392.0 Z" fill="#5A6863"/>
<rect x="24" y="401.0" width="228" height="124" rx="10" fill="#E3F1EA" stroke="#0B6B4F" stroke-width="1.5"/>
<text x="38" y="427.0" font-size="16" font-weight="600" fill="#10201A">Zugelassen</text>
<text x="38" y="449.0" font-size="14" fill="#3E4C46">Im EU-Register, mit</text>
<text x="38" y="468.0" font-size="14" fill="#3E4C46">festem Wortlaut.</text>
<text x="38" y="487.0" font-size="14" fill="#3E4C46">Vitamine, Mineralstoffe,</text>
<text x="38" y="506.0" font-size="14" fill="#3E4C46">Kreatin, Melatonin</text>
<path d="M164.0,367.0 V383.0 H382.0 V394.0" fill="none" stroke="#5A6863" stroke-width="2"/>
<path d="M376.0,392.0 L382.0,401.0 L388.0,392.0 Z" fill="#5A6863"/>
<rect x="268" y="401.0" width="228" height="124" rx="10" fill="#FCEBDD" stroke="#B4470E" stroke-width="1.5"/>
<text x="282" y="427.0" font-size="16" font-weight="600" fill="#10201A">Abgelehnt</text>
<text x="282" y="449.0" font-size="14" fill="#3E4C46">Darf nicht verwendet</text>
<text x="282" y="468.0" font-size="14" fill="#3E4C46">werden. Glucosamin,</text>
<text x="282" y="487.0" font-size="14" fill="#3E4C46">Probiotika-Stämme</text>
<text x="496" y="553" font-size="13" fill="#5A6863" text-anchor="end">nutrimetrics.eu</text>
</g></svg>
