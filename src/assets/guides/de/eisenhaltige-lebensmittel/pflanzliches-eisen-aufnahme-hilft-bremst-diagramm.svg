<text x="24" y="62" font-size="15" fill="#5A6863">Am stärksten betroffen ist Eisen aus Pflanzen (NIH)</text>
<rect x="165" y="104" width="190" height="46" rx="23" fill="#10201A"/>
<text x="260.0" y="133" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF">Pflanzliches Eisen</text>
<line x1="220.0" y1="150.0" x2="144.4" y2="185.1" stroke="#0B6B4F" stroke-width="2"/>
<path d="M149.6,189.2 L138.0,188.0 L144.6,178.4 Z" fill="#0B6B4F"/>
<line x1="300.0" y1="150.0" x2="375.6" y2="185.1" stroke="#B4470E" stroke-width="2"/>
<path d="M375.4,178.4 L382.0,188.0 L370.4,189.2 Z" fill="#B4470E"/>
<rect x="24" y="190" width="228" height="166" rx="10" fill="#E3F1EA" stroke="#0B6B4F" stroke-width="1.5"/>
<text x="36" y="217" font-size="15" font-weight="600" fill="#10201A">Hilft bei der Aufnahme</text>
<circle cx="39" cy="238" r="2.5" fill="#3E4C46"/>
<text x="48" y="243" font-size="14" fill="#3E4C46">Vitamin C: rohe rote</text>
<text x="48" y="262" font-size="14" fill="#3E4C46">Paprika, Petersilie,</text>
<text x="48" y="281" font-size="14" fill="#3E4C46">Brokkoli, eine Orange</text>
<circle cx="39" cy="295" r="2.5" fill="#3E4C46"/>
<text x="48" y="300" font-size="14" fill="#3E4C46">Fleisch, Geflügel, Fisch</text>
<text x="48" y="319" font-size="14" fill="#3E4C46">oder Meeresfrüchte in</text>
<text x="48" y="338" font-size="14" fill="#3E4C46">derselben Mahlzeit</text>
<rect x="268" y="190" width="228" height="166" rx="10" fill="#FCEBDD" stroke="#B4470E" stroke-width="1.5"/>
<text x="280.0" y="217" font-size="15" font-weight="600" fill="#10201A">Bremst die Aufnahme</text>
<circle cx="283" cy="238" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="243" font-size="14" fill="#3E4C46">Phytate in Getreide und</text>
<text x="292.0" y="262" font-size="14" fill="#3E4C46">Hülsenfrüchten</text>
<circle cx="283" cy="276" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="281" font-size="14" fill="#3E4C46">Polyphenole in Tee und</text>
<text x="292.0" y="300" font-size="14" fill="#3E4C46">Kaffee</text>
<circle cx="283" cy="314" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="319" font-size="14" fill="#3E4C46">Vielleicht Calcium, etwa</text>
<text x="292.0" y="338" font-size="14" fill="#3E4C46">als Präparat</text>
<text x="496" y="404" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
