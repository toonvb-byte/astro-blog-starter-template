<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 422" width="520" height="422" role="img" aria-labelledby="t d" lang="de">
<title id="t">Mehr Eisen aus derselben Mahlzeit</title>
<desc id="d">Hilft bei der Aufnahme: Vitamin C: rohe rote Paprika, Petersilie, Brokkoli, eine Orange; Fleisch, Geflügel, Fisch oder Meeresfrüchte in derselben Mahlzeit. Bremst die Aufnahme: Phytate in Getreide und Hülsenfrüchten; Polyphenole in Tee und Kaffee; Vielleicht Calcium, etwa als Präparat.</desc>
<rect width="520" height="422" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
