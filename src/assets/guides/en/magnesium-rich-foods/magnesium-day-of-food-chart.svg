<title id="t">A day of food with 461 mg of magnesium</title>
<desc id="d">Three meals from this guide, against EFSA's adequate intake. Breakfast: Porridge with banana and pumpkin seeds (recipe below) 210 mg; Lunch: Spanish spinach with chickpeas (recipe below) 170 mg; Snack: A handful of almonds (30 g) 81 mg. Total 461 mg.</desc>
