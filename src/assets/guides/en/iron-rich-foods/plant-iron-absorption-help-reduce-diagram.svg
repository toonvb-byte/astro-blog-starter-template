<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 422" width="520" height="422" role="img" aria-labelledby="t d" lang="en">
<title id="t">Getting more iron from the same plate</title>
<desc id="d">Helps you absorb it: Vitamin C: raw red pepper, parsley, broccoli, an orange; Meat, poultry, fish or shellfish in the same meal. Reduces absorption: Phytates in grains and pulses; Polyphenols in tea and coffee; Possibly calcium, for example a supplement.</desc>
<rect width="520" height="422" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">Getting more iron from the same plate</text>
<text x="24" y="62" font-size="15" fill="#5A6863">Plant iron is the kind most affected (NIH)</text>
<rect x="165" y="104" width="190" height="46" rx="23" fill="#10201A"/>
<text x="260.0" y="133" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF">Iron from plants</text>
<line x1="220.0" y1="150.0" x2="144.4" y2="185.1" stroke="#0B6B4F" stroke-width="2"/>
<path d="M149.6,189.2 L138.0,188.0 L144.6,178.4 Z" fill="#0B6B4F"/>
<line x1="300.0" y1="150.0" x2="375.6" y2="185.1" stroke="#B4470E" stroke-width="2"/>
<path d="M375.4,178.4 L382.0,188.0 L370.4,189.2 Z" fill="#B4470E"/>
<rect x="24" y="190" width="228" height="147" rx="10" fill="#E3F1EA" stroke="#0B6B4F" stroke-width="1.5"/>
<text x="36" y="217" font-size="15" font-weight="600" fill="#10201A">Helps you absorb it</text>
<circle cx="39" cy="238" r="2.5" fill="#3E4C46"/>
<text x="48" y="243" font-size="14" fill="#3E4C46">Vitamin C: raw red pepper,</text>
<text x="48" y="262" font-size="14" fill="#3E4C46">parsley, broccoli, an</text>
<text x="48" y="281" font-size="14" fill="#3E4C46">orange</text>
<circle cx="39" cy="295" r="2.5" fill="#3E4C46"/>
<text x="48" y="300" font-size="14" fill="#3E4C46">Meat, poultry, fish or</text>
<text x="48" y="319" font-size="14" fill="#3E4C46">shellfish in the same meal</text>
<rect x="268" y="190" width="228" height="166" rx="10" fill="#FCEBDD" stroke="#B4470E" stroke-width="1.5"/>
<text x="280.0" y="217" font-size="15" font-weight="600" fill="#10201A">Reduces absorption</text>
<circle cx="283" cy="238" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="243" font-size="14" fill="#3E4C46">Phytates in grains and</text>
<text x="292.0" y="262" font-size="14" fill="#3E4C46">pulses</text>
<circle cx="283" cy="276" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="281" font-size="14" fill="#3E4C46">Polyphenols in tea and</text>
<text x="292.0" y="300" font-size="14" fill="#3E4C46">coffee</text>
<circle cx="283" cy="314" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="319" font-size="14" fill="#3E4C46">Possibly calcium, for</text>
<text x="292.0" y="338" font-size="14" fill="#3E4C46">example a supplement</text>
<text x="496" y="404" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
</g></svg>
