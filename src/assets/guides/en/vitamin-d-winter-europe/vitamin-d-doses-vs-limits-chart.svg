<title id="t">Vitamin D per day: products and limits</title>
<desc id="d">µg per day; both products are above the BfR's 20 µg. EFSA adequate intake: 15 µg (600 IU); BfR maximum per supplement (Germany): 20 µg (800 IU); Vita Natura D3+K2 drops: 25 µg (1,000 IU); Solgar Vitamin D3 2200 IU capsules: 55 µg (2,200 IU); EFSA upper level, all sources: 100 µg (4,000 IU)</desc>
