<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 730" width="520" height="730" role="img" aria-labelledby="t d" lang="en">
<title id="t">How to read a supplement label</title>
<desc id="d">Example label of a fictional product, with the five things to check. 1. Daily dose: here 2 capsules, so this pack lasts 30 days, not 60. 2. Amount per daily dose: what you compare between products. 3. %NRV: the amount against the EU reference value, not a maximum. 4. Form: the amount is the magnesium itself, not the weight of the citrate. 5. Mandatory warnings: the dose not to exceed, diet, children.</desc>
<rect width="520" height="730" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">How to read a supplement label</text>
<text x="24" y="62" font-size="15" fill="#5A6863">Example label of a fictional product, with the five things</text>
<text x="24" y="82" font-size="15" fill="#5A6863">to check</text>
<rect x="38" y="120" width="444" height="350" rx="12" fill="#FBFCFA" stroke="#3E4C46" stroke-width="1.5"/>
<rect x="386" y="132" width="80" height="22" rx="11" fill="#FCEBDD"/>
<text x="426" y="147" font-size="11" font-weight="700" text-anchor="middle" fill="#B4470E">EXAMPLE</text>
<text x="54" y="150" font-size="12" font-weight="600" fill="#5A6863">FOOD SUPPLEMENT</text>
<text x="54" y="174" font-size="19" font-weight="700" fill="#10201A">Magnesium + Vitamin B6</text>
<text x="54" y="200" font-size="13" fill="#5A6863">60 capsules</text>
<rect x="54" y="220" width="412" height="34" fill="#10201A"/>
<text x="64" y="242" font-size="13" font-weight="600" fill="#FFFFFF">Per daily dose (2 capsules)</text>
<text x="456" y="242" font-size="13" font-weight="600" text-anchor="end" fill="#FFFFFF">%NRV*</text>
<rect x="54" y="254" width="412" height="46" fill="#F4F6F4" stroke="#DCE1DD"/>
<text x="64" y="274" font-size="14" font-weight="600" fill="#10201A">Magnesium</text>
<text x="64" y="291" font-size="12" fill="#3E4C46">(as magnesium citrate)</text>
<text x="372" y="281" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">150 mg</text>
<text x="456" y="281" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">40%</text>
<rect x="54" y="300" width="412" height="46" fill="#FFFFFF" stroke="#DCE1DD"/>
<text x="64" y="320" font-size="14" font-weight="600" fill="#10201A">Vitamin B6</text>
<text x="372" y="327" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">1.4 mg</text>
<text x="456" y="327" font-size="14" font-weight="600" text-anchor="end" fill="#10201A">100%</text>
<text x="54" y="364" font-size="11" fill="#5A6863">*NRV = nutrient reference value</text>
<text x="54" y="386" font-size="12" fill="#10201A">Recommended daily dose: 2 capsules. Do not exceed the</text>
<text x="54" y="402" font-size="12" fill="#10201A">recommended daily dose.</text>
<text x="54" y="424" font-size="12" fill="#3E4C46">Food supplements should not be used as a substitute for a</text>
<text x="54" y="440" font-size="12" fill="#3E4C46">varied diet. Keep out of the reach of young children.</text>
<circle cx="265" cy="237" r="11" fill="#B4470E"/>
<text x="264.6" y="242" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="307" cy="277" r="11" fill="#B4470E"/>
<text x="307.0" y="282" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="402" cy="218" r="11" fill="#B4470E"/>
<text x="402" y="223" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="217" cy="287" r="11" fill="#B4470E"/>
<text x="217.3" y="292" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<circle cx="468" cy="420" r="11" fill="#B4470E"/>
<text x="468" y="425" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<circle cx="35" cy="493" r="11" fill="#B4470E"/>
<text x="35" y="498" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="56" y="498" font-size="14" fill="#3E4C46">Daily dose: here 2 capsules, so this pack lasts 30 days,</text>
<text x="56" y="517" font-size="14" fill="#3E4C46">not 60</text>
<circle cx="35" cy="541" r="11" fill="#B4470E"/>
<text x="35" y="546" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="56" y="546" font-size="14" fill="#3E4C46">Amount per daily dose: what you compare between products</text>
<circle cx="35" cy="570" r="11" fill="#B4470E"/>
<text x="35" y="575" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="56" y="575" font-size="14" fill="#3E4C46">%NRV: the amount against the EU reference value, not a</text>
<text x="56" y="594" font-size="14" fill="#3E4C46">maximum</text>
<circle cx="35" cy="618" r="11" fill="#B4470E"/>
<text x="35" y="623" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="56" y="623" font-size="14" fill="#3E4C46">Form: the amount is the magnesium itself, not the weight of</text>
<text x="56" y="642" font-size="14" fill="#3E4C46">the citrate</text>
<circle cx="35" cy="666" r="11" fill="#B4470E"/>
<text x="35" y="671" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="56" y="671" font-size="14" fill="#3E4C46">Mandatory warnings: the dose not to exceed, diet, children</text>
<text x="496" y="712" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
</g></svg>
