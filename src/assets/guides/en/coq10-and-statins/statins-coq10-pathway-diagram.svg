<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 548" width="520" height="548" role="img" aria-labelledby="t d" lang="en">
<title id="t">Why statins lower CoQ10</title>
<desc id="d">One production line in the liver makes both cholesterol and coenzyme Q10. Starting materials in the liver → Enzyme HMG-CoA reductase (Statin blocks this step) → Shared production line → Cholesterol: Lower: the aim of the statin; Coenzyme Q10: Lower blood levels too (NIH). Lower blood levels don't prove that muscle levels drop enough to cause aches.</desc>
<rect width="520" height="548" rx="14" fill="#FFFFFF"/>
<g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="38" font-size="21" font-weight="600" fill="#10201A">Why statins lower CoQ10</text>
<text x="24" y="62" font-size="15" fill="#5A6863">One production line in the liver makes both cholesterol and</text>
<text x="24" y="82" font-size="15" fill="#5A6863">coenzyme Q10</text>
<rect x="24" y="124" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="152" font-size="15" font-weight="600" fill="#10201A">Starting materials in the liver</text>
<line x1="174.0" y1="168.0" x2="174.0" y2="191.0" stroke="#5A6863" stroke-width="2"/>
<path d="M180.0,188.0 L174.0,198.0 L168.0,188.0 Z" fill="#5A6863"/>
<rect x="24" y="200" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="228" font-size="15" font-weight="600" fill="#10201A">Enzyme HMG-CoA reductase</text>
<rect x="346" y="195" width="150" height="54" rx="10" fill="#FCEBDD" stroke="#B4470E" stroke-width="1.5"/>
<text x="358" y="217.0" font-size="14" font-weight="600" fill="#10201A">Statin blocks</text>
<text x="358" y="235.0" font-size="14" font-weight="600" fill="#10201A">this step</text>
<path d="M326,222 L344,222" stroke="#B4470E" stroke-width="3"/>
<path d="M158.0,258 L190.0,258" stroke="#B4470E" stroke-width="4" stroke-linecap="round"/>
<line x1="174.0" y1="244.0" x2="174.0" y2="279.0" stroke="#9AA6A0" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M180.0,276.0 L174.0,286.0 L168.0,276.0 Z" fill="#9AA6A0"/>
<rect x="24" y="288" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#DCE1DD" stroke-width="1.5"/>
<text x="38" y="316" font-size="15" font-weight="600" fill="#10201A">Shared production line</text>
<path d="M174.0,332 V350 H138.0 V364" fill="none" stroke="#9AA6A0" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M132.0,362 L138.0,372 L144.0,362 Z" fill="#9AA6A0"/>
<rect x="24" y="372" width="228" height="90" rx="10" fill="#F2F4F2"/>
<text x="36.0" y="399" font-size="15" font-weight="600" fill="#10201A">Cholesterol ↓</text>
<circle cx="39" cy="420" r="2.5" fill="#3E4C46"/>
<text x="48.0" y="425" font-size="14" fill="#3E4C46">Lower: the aim of the</text>
<text x="48.0" y="444" font-size="14" fill="#3E4C46">statin</text>
<path d="M174.0,332 V350 H382.0 V364" fill="none" stroke="#9AA6A0" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M376.0,362 L382.0,372 L388.0,362 Z" fill="#9AA6A0"/>
<rect x="268" y="372" width="228" height="90" rx="10" fill="#F2F4F2"/>
<text x="280.0" y="399" font-size="15" font-weight="600" fill="#10201A">Coenzyme Q10 ↓</text>
<circle cx="283" cy="420" r="2.5" fill="#3E4C46"/>
<text x="292.0" y="425" font-size="14" fill="#3E4C46">Lower blood levels too</text>
<text x="292.0" y="444" font-size="14" fill="#3E4C46">(NIH)</text>
<text x="24" y="480" font-size="14" fill="#5A6863">Lower blood levels don't prove that muscle levels drop enough to</text>
<text x="24" y="499" font-size="14" fill="#5A6863">cause aches.</text>
<text x="496" y="530" font-size="13" text-anchor="end" fill="#5A6863">nutrimetrics.eu</text>
</g></svg>
